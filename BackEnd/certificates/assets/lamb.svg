<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <!-- Lamb Image Placeholder -->
  <g id="lamb">
    <!-- Body -->
    <ellipse cx="75" cy="90" rx="35" ry="30" fill="#f5f5f5" stroke="#666" stroke-width="1.5"/>
    <!-- Legs -->
    <rect x="55" y="110" width="6" height="25" fill="#d4a574" stroke="#666" stroke-width="1"/>
    <rect x="70" y="110" width="6" height="25" fill="#d4a574" stroke="#666" stroke-width="1"/>
    <rect x="85" y="110" width="6" height="25" fill="#d4a574" stroke="#666" stroke-width="1"/>
    <rect x="100" y="110" width="6" height="25" fill="#d4a574" stroke="#666" stroke-width="1"/>
    <!-- Neck -->
    <rect x="70" y="65" width="10" height="25" fill="#d4a574" stroke="#666" stroke-width="1"/>
    <!-- Head -->
    <circle cx="75" cy="50" r="15" fill="#e8d4c4" stroke="#666" stroke-width="1.5"/>
    <!-- Ears -->
    <ellipse cx="65" cy="40" rx="5" ry="10" fill="#d4a574" stroke="#666" stroke-width="1"/>
    <ellipse cx="85" cy="40" rx="5" ry="10" fill="#d4a574" stroke="#666" stroke-width="1"/>
    <!-- Eyes -->
    <circle cx="70" cy="48" r="2" fill="#333"/>
    <circle cx="80" cy="48" r="2" fill="#333"/>
    <!-- Nose -->
    <ellipse cx="75" cy="55" rx="2" ry="3" fill="#333"/>
  </g>
</svg>
